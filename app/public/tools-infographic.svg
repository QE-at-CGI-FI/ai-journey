<svg width="644" height="670" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
<style>
  text { font-family: 'Segoe UI', Segoe UI, sans-serif; fill: #141413; }
  .subtitle, .body { fill: #3D3D3A; }
  .num { font-family: 'Cambria Math', serif; fill: #3D3D3A; font-size: 12px; }
  .section-label { fill: #3D3D3A; font-size: 12px; }
  .col-head { fill: #5C2D91; font-size: 12px; }
  .cell-title { font-size: 14px; fill: #141413; }
  .cell-unknown { font-size: 14px; fill: #888888; }
  .vendor-label { font-size: 14px; fill: #141413; }
</style>

<text x="322" y="26" text-anchor="middle" font-size="16">Tool ecosystem across vendors</text>
<text class="subtitle" x="322" y="44" text-anchor="middle" font-size="12">What's available for chat, office, and dev work — and where the gaps are</text>

<text class="num" x="37" y="68">&#9312;</text>
<text class="section-label" x="51" y="68">Vendor tool matrix</text>
<line x1="37" y1="76" x2="607" y2="76" stroke="#D9D9D9" stroke-width="1"/>

<text class="col-head" x="213" y="94" text-anchor="middle">Chat</text>
<text class="col-head" x="369" y="94" text-anchor="middle">Office</text>
<text class="col-head" x="525" y="94" text-anchor="middle">Dev</text>

<!-- Anthropic row -->
<text class="vendor-label" x="37" y="127">Anthropic</text>
<rect x="139" y="100" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="213" y="127" text-anchor="middle">Claude</text>
<rect x="295" y="100" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="369" y="127" text-anchor="middle">Claude Cowork</text>
<rect x="451" y="100" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="525" y="127" text-anchor="middle">Claude Code</text>

<rect x="37" y="150" width="562" height="24" rx="6" fill="#F0EBF8"/>
<text x="47" y="166" font-size="11" fill="#5C2D91">→ Richest first-party tool ecosystem of the five — but strongest vendor lock-in</text>

<!-- OpenAI row -->
<text class="vendor-label" x="37" y="211">OpenAI</text>
<rect x="139" y="184" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="213" y="211" text-anchor="middle">ChatGPT</text>
<rect x="295" y="184" width="148" height="46" rx="8" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="4 3" fill="#F5F5F5"/>
<text class="cell-unknown" x="369" y="211" text-anchor="middle">?</text>
<rect x="451" y="184" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="525" y="211" text-anchor="middle">Codex</text>

<!-- AWS row -->
<text class="vendor-label" x="37" y="271">AWS</text>
<rect x="139" y="244" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="213" y="271" text-anchor="middle">Amazon Q</text>
<rect x="295" y="244" width="148" height="46" rx="8" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="4 3" fill="#F5F5F5"/>
<text class="cell-unknown" x="369" y="271" text-anchor="middle">?</text>
<rect x="451" y="244" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="525" y="271" text-anchor="middle">Kiro</text>

<rect x="37" y="294" width="562" height="24" rx="6" fill="#F0EBF8"/>
<text x="47" y="310" font-size="11" fill="#5C2D91">→ Already a pre-trusted cloud provider</text>

<!-- Google row -->
<text class="vendor-label" x="37" y="357">Google</text>
<rect x="139" y="330" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="213" y="357" text-anchor="middle">Gemini</text>
<rect x="295" y="330" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="369" y="357" text-anchor="middle" font-size="12.5">Gemini Workspace</text>
<rect x="451" y="330" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="525" y="357" text-anchor="middle" font-size="12.5">Gemini Code Assist</text>

<rect x="37" y="380" width="562" height="24" rx="6" fill="#F0EBF8"/>
<text x="47" y="396" font-size="11" fill="#5C2D91">→ Already a pre-trusted cloud and office provider</text>

<!-- Microsoft row -->
<text class="vendor-label" x="37" y="441">Microsoft</text>
<rect x="139" y="414" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="213" y="441" text-anchor="middle">Edge Copilot</text>
<rect x="295" y="414" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="369" y="441" text-anchor="middle">M365 Copilot</text>
<rect x="451" y="414" width="148" height="46" rx="8" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text class="cell-title" x="525" y="441" text-anchor="middle">GitHub Copilot</text>

<rect x="37" y="464" width="562" height="40" rx="6" fill="#F0EBF8"/>
<text x="47" y="478" font-size="11" fill="#5C2D91">→ Already a pre-trusted cloud and office provider</text>
<text x="47" y="494" font-size="11" fill="#5C2D91">→ Also provides native access to Anthropic and OpenAI models</text>

<text class="num" x="37" y="524">&#9313;</text>
<text class="section-label" x="51" y="524">Before adopting</text>
<line x1="37" y1="532" x2="607" y2="532" stroke="#D9D9D9" stroke-width="1"/>

<rect x="37" y="544" width="277" height="110" rx="10" stroke="#5C2D91" stroke-width="1" fill="#EDE8F5"/>
<text x="176" y="568" text-anchor="middle" font-size="14">Included tokens</text>
<text class="body" x="176" y="588" text-anchor="middle" font-size="12">How much usage is bundled</text>
<text class="body" x="176" y="602" text-anchor="middle" font-size="12">per seat or plan, and what</text>
<text class="body" x="176" y="616" text-anchor="middle" font-size="12">happens after the cap</text>

<rect x="330" y="544" width="277" height="110" rx="10" stroke="#DA1A32" stroke-width="1" fill="#FCEAEC"/>
<text x="468" y="568" text-anchor="middle" font-size="14">Terms of service</text>
<text class="body" x="468" y="588" text-anchor="middle" font-size="12">Data use, retention, and</text>
<text class="body" x="468" y="602" text-anchor="middle" font-size="12">training opt-out clauses to</text>
<text class="body" x="468" y="616" text-anchor="middle" font-size="12">review before rollout</text>
</svg>
